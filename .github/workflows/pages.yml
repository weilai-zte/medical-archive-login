name: Deploy login portal only
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Check public bundle
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          files={str(p.relative_to('site')) for p in Path('site').rglob('*') if p.is_file()}
          allowed={'index.html','styles.css','core.js','reader.js','app.js','config.json','vendor/fflate-0.8.2.min.js','vendor/fflate-LICENSE','preview.js','vendor/pdfjs-6.5.438/pdf.mjs','vendor/pdfjs-6.5.438/pdf.worker.mjs','vendor/pdfjs-6.5.438/LICENSE','.nojekyll','robots.txt'}
          assert files==allowed, 'Unexpected public files'
          PYCODE
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
