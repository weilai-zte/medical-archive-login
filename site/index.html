<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob: data: 'unsafe-inline'; style-src 'self' 'unsafe-inline' blob: data:; connect-src 'self' https:; img-src 'self' blob: data:; font-src blob: data:; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>私人资料入口</title><link rel="stylesheet" href="styles.css">
<script defer src="vendor/fflate-0.8.2.min.js"></script><script defer src="core.js"></script><script defer src="reader.js"></script><script defer src="app.js"></script></head>
<body><main id="main" tabindex="-1">
<section id="login" class="card"><h1>私人资料入口</h1><p>登录后在当前页面读取资料。刷新页面需要重新登录。</p>
<form id="login-form"><label for="username">用户名（必填）</label><input id="username" name="username" autocomplete="username" required autocapitalize="none" spellcheck="false">
<label for="password">密码（必填）</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">登录</button><button id="cancel" type="button" hidden>取消并清空</button></form></section>
<p id="status" role="status" aria-live="polite"></p><p id="error" role="alert" tabindex="-1"></p>
<section id="workspace" hidden><nav aria-label="阅读工具"><button id="home" type="button">返回入口</button><button id="back" type="button">上一页</button><button id="print" type="button">打印当前页</button><button id="logout" type="button">退出并清空</button></nav>
<p id="reader-hint">从入口阅读原有内容。退出会清空本页资料；已下载的文件请自行保管。</p>
<p id="open-file" hidden><a id="file-link" target="_blank" rel="noopener noreferrer">打开原件或外部链接</a> <a id="download-link" download>下载原件</a></p>
<div id="frame-host"></div></section>
</main></body></html>
