<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob: data: 'unsafe-inline'; style-src 'self' 'unsafe-inline' blob: data:; connect-src 'self' https:; img-src 'self' blob: data:; font-src blob: data:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>私人资料入口</title><link rel="stylesheet" href="styles.css?v=20261123-7">
<script defer src="vendor/fflate-0.8.2.min.js"></script><script defer src="core.js"></script><script defer src="reader.js?v=20261123-8"></script><script defer src="preview.js?v=20261123-7"></script><script defer src="app.js?v=20261123-8"></script></head>
<body><main id="main" tabindex="-1">
<section id="login" class="card"><h1>私人资料入口</h1><p>登录后先加载档案页面，报告和图片按需读取。刷新页面需要重新登录。</p>
<form id="login-form"><label for="username">用户名（必填）</label><input id="username" name="username" autocomplete="username" required autocapitalize="none" spellcheck="false">
<label for="password">密码（必填）</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">登录</button><button id="cancel" type="button" hidden>取消并清空</button></form></section>
<p id="status" role="status" aria-live="polite"></p><p id="error" role="alert" tabindex="-1"></p>
<section id="workspace" hidden>
<header class="session-bar"><button id="logout" type="button">退出登录</button></header>
<div id="frame-host"></div></section>
<dialog id="report-preview" aria-labelledby="preview-title">
<header class="preview-head"><h2 id="preview-title">原报告预览</h2><button id="close-preview" type="button" aria-label="关闭报告预览">关闭</button></header>
<div class="preview-tools"><button id="zoom-out" type="button" aria-label="缩小报告">−</button><span id="zoom-label" aria-live="polite">100%</span><button id="zoom-in" type="button" aria-label="放大报告">＋</button><a id="download-link" download>下载原件</a></div>
<p id="preview-status" role="status" aria-live="polite"></p><button id="preview-retry" type="button" hidden>重新读取</button>
<div id="preview-content"><img id="original-image" alt="所选原报告图片" hidden><div id="pdf-pages"></div><p id="preview-unsupported" hidden>此文件可下载后查看。</p></div>
</dialog>
</main></body></html>
